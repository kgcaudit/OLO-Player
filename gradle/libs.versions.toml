[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
media3 = "1.5.1"
commonsNet = "3.11.1"
jsch = "0.2.21"
smbj = "0.14.0"
# Coil: loads and caches the TMDB poster/still images into Compose (AsyncImage).
coil = "2.7.0"
# core-ftp (pure JVM engine ported from OLO Explorer) and its tests.
coroutines = "1.9.0"
junit5 = "5.11.3"
sshd = "2.14.0"
# App unit tests + the Robolectric mockup/screenshot harness (NATIVE graphics).
junit4 = "4.13.2"
robolectric = "4.14.1"
androidxTestCore = "1.6.1"
# jaudiotagger Android 포크(Adonai): MP3·FLAC·M4A·OGG/OPUS·WAV 태그·앨범아트 읽기/쓰기.
jaudiotagger = "2.3.15"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# media3: the media core. exoplayer plays, ui draws the PlayerView (and its
# subtitle view), session gives the MediaSession/MediaController and the
# notification. guava (ListenableFuture, ImmutableList) rides in on session.
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }

# Apache Commons Net: the FTP client behind FtpDataSource (streaming) and the
# FTP browser's directory listing. Pure Java, no Android dependency.
commons-net = { module = "commons-net:commons-net", version.ref = "commonsNet" }

# JSch (maintained mwiede fork): the SSH/SFTP client behind SftpDataSource and
# the SFTP browser. Pure Java.
jsch = { module = "com.github.mwiede:jsch", version.ref = "jsch" }

# smbj: the SMB2/3 client behind SmbDataSource and the SMB browser (Windows/NAS
# shares). Pulls Bouncy Castle for SMB3 crypto -- sizeable, shrunk by R8 in
# release.
smbj = { module = "com.hierynomus:smbj", version.ref = "smbj" }

# jaudiotagger(Adonai Android 포크, jitpack): 로컬 음악 파일의 태그·앨범아트 읽기/쓰기.
# 상위 jthink 버전과 달리 java.awt/ImageIO 없이 안드로이드에서 앨범아트까지 동작한다.
jaudiotagger = { module = "com.github.Adonai:jaudiotagger", version.ref = "jaudiotagger" }

# Coil for Compose: AsyncImage streams a poster URL into a row/grid cell and keeps
# its own memory + disk cache, so a poster is fetched once and redraws instantly.
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

# core-ftp engine + its test harness (pure JVM: coroutines, JUnit 5, Apache MINA
# SSHD for a real in-process SFTP server in the module's own tests).
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.3" }
sshd-core = { module = "org.apache.sshd:sshd-core", version.ref = "sshd" }
sshd-sftp = { module = "org.apache.sshd:sshd-sftp", version.ref = "sshd" }

# App unit tests + Robolectric screenshot harness.
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
